apply plugin: 'com.android.application'

// versionName follows package.json, so the APK says which release it is. versionCode must only grow
// (Android refuses an APK with a lower one over the installed app): derived from the version
// (1.2.3 -> 10203) so local and CI builds of a release agree; -PversionCode overrides it.
def appVersionName = new groovy.json.JsonSlurper().parse(file('../../package.json')).version as String
def (major, minor, patch) = appVersionName.tokenize('.-+').take(3)*.toInteger()
if (minor > 99 || patch > 99) {
    throw new GradleException("versionCode derivation needs minor and patch below 100, got $appVersionName")
}
def appVersionCode = (findProperty('versionCode') ?: major * 10000 + minor * 100 + patch) as int

// Android installs an update only if it is signed with the same key as the installed app, and the debug
// key is per machine (a fresh one on every CI runner). CI passes a fixed key through ANDROID_KEYSTORE_*
// (secrets, see .github/workflows/android.yml); the same names work as -P or ~/.gradle/gradle.properties
// locally. Without them the build keeps the debug key, as before.
def signingValue = { String name -> System.getenv(name) ?: findProperty(name) }
def stableKeystore = signingValue('ANDROID_KEYSTORE_FILE')

android {
    namespace = "com.damned.cloud"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.damned.cloud"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (stableKeystore) {
            stable {
                storeFile file(stableKeystore)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('ANDROID_KEY_ALIAS')
                keyPassword signingValue('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        // the published DamnedCloud.apk is the debug build, so the stable key goes there too
        debug {
            if (stableKeystore) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (stableKeystore) signingConfig signingConfigs.stable
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
