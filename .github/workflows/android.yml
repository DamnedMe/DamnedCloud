name: Android APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    # a landing page or README change does not need a new APK (tag pushes ignore this filter)
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

# every push to main publishes the next release: two merges close together must not compute the same tag
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The release version: a pushed tag vX.Y.Z is used as is; a push to main (a merged PR) publishes the
      # next patch after the highest v* tag, or package.json's version when it was raised above it by hand
      # (0.2.0 starts a new minor). Other builds keep package.json's version.
      - name: Resolve version
        run: |
          PKG=$(node -p "require('./package.json').version")
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            git fetch --tags --force --quiet origin
            LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
            if [ -z "$LAST" ]; then
              VERSION="$PKG"
            else
              IFS=. read -r MA MI PA <<< "$LAST"
              VERSION="$MA.$MI.$((PA + 1))"
              # package.json raised by hand above the last release wins
              if [ "$(printf '%s\n%s\n' "$VERSION" "$PKG" | sort -V | tail -n1)" = "$PKG" ]; then VERSION="$PKG"; fi
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::tag v$VERSION already exists"
              exit 1
            fi
            RELEASE=true
          else
            VERSION="$PKG"
          fi
          echo "Version: $VERSION (release: $RELEASE)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # the Capacitor CLI (cap sync) requires Node >= 22
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the default 'tools' package no longer exists in current SDKs ("Failed to find package 'tools'")
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      # versionName/versionCode (android/app/build.gradle) and the version shown in Settings both read
      # package.json: set it in this checkout only, so the APK carries the release's version
      - name: Apply version
        run: npm pkg set version="$VERSION"

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Android installs an update only over an APK signed with the same key; the runner's debug key is
      # new on every run. Secrets are not readable in 'if:', so the check happens in the shell.
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            # a release signed with a throwaway key is refused as an update ("package conflicts with an
            # existing package"): never publish one
            if [ "$RELEASE" = true ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set: a release APK must be signed with the stable key (see README, Firma dell'APK)."
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with this runner's throwaway debug key and will not install over a previous version (uninstall it first)."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/damnedcloud.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/damnedcloud.jks" >> "$GITHUB_ENV"

      # versionName/versionCode come from package.json (android/app/build.gradle), same as local builds
      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DamnedCloud.apk

      - name: Check APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          # ws:// to the bridge depends on it (res/xml/network_security_config.xml)
          "$BT/aapt2" dump xmltree DamnedCloud.apk --file AndroidManifest.xml | grep -q networkSecurityConfig \
            || { echo "::error::networkSecurityConfig missing from the APK manifest: ws:// to the bridge would be blocked"; exit 1; }
          # this fingerprint must not change between releases, or updates will not install:
          # android/signing-cert.sha256 pins it, and a release with another key fails here
          CERT=$("$BT/apksigner" verify --print-certs DamnedCloud.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "Signing certificate SHA-256: $CERT"
          if [ ! -f android/signing-cert.sha256 ]; then
            echo "::notice::android/signing-cert.sha256 is missing: commit this fingerprint there to pin the release key"
          elif [ "$CERT" != "$(tr -d '[:space:]' < android/signing-cert.sha256)" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::the APK is not signed with the pinned key (android/signing-cert.sha256): it would not install as an update"
              exit 1
            fi
            echo "::warning::the APK is not signed with the pinned key (android/signing-cert.sha256): it will not install over a released version"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DamnedCloud
          path: DamnedCloud.apk

      # creates the tag vX.Y.Z on this commit and the release when they do not exist yet (push to main).
      # A tag or release made with GITHUB_TOKEN starts no workflow, so nothing builds the APK twice.
      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: DamnedCloud.apk
