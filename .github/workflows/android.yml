name: Android APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # the Capacitor CLI (cap sync) requires Node >= 22
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the default 'tools' package no longer exists in current SDKs ("Failed to find package 'tools'")
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Android installs an update only over an APK signed with the same key; the runner's debug key is
      # new on every run. Secrets are not readable in 'if:', so the check happens in the shell.
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with this runner's throwaway debug key and will not install over a previous version (uninstall it first)."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/damnedcloud.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/damnedcloud.jks" >> "$GITHUB_ENV"

      # versionName/versionCode come from package.json (android/app/build.gradle), same as local builds
      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DamnedCloud.apk

      - name: Check APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          # ws:// to the bridge depends on it (res/xml/network_security_config.xml)
          "$BT/aapt2" dump xmltree DamnedCloud.apk --file AndroidManifest.xml | grep -q networkSecurityConfig \
            || { echo "::error::networkSecurityConfig missing from the APK manifest: ws:// to the bridge would be blocked"; exit 1; }
          # this fingerprint must not change between releases, or updates will not install
          "$BT/apksigner" verify --print-certs DamnedCloud.apk | grep 'SHA-256'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DamnedCloud
          path: DamnedCloud.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DamnedCloud.apk
